<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>确认导入 BUFF 会话</title>
  <link rel="stylesheet" href="confirm.css">
  <script type="module" src="confirm.js"></script>
</head>
<body>
  <main>
    <p class="kicker">AETHERSWAP / BUFF SESSION</p>
    <h1>确认导入 BUFF 会话</h1>
    <p class="lede">确认后，扩展将读取当前 Chrome 个人资料中的 BUFF 登录 Cookie，并发送到以下 AetherSwap 来源进行验证。</p>
    <p id="target-origin" class="target">正在核对目标来源…</p>
    <p class="note">浏览器会保留 AetherSwap 当前的 HTTP Basic 认证。Cookie 不会进入网页、扩展存储或日志。</p>
    <p id="status" class="status" role="alert"></p>
    <div class="actions">
      <button id="cancel" type="button">取消</button>
      <button id="confirm" class="primary" type="button" disabled>确认导入</button>
    </div>
  </main>
</body>
</html>
